name: FHIR IG Build

on:
  push:
    branches: [BloodQTest]
  pull_request:
    branches: [BloodQTest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Use the same reproducible publisher build as validate-docs.yml.
      PUBLISHER_URL: https://media.githubusercontent.com/media/vadi2/ig-publisher-builds/main/publisher-3.0.0-optimised.jar
      PUBLISHER_SHA256: 34f1bc11c5fd1a9c1d639ad5a8b11b4939073c09e8b8c99838d626c0dde796c1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Install SUSHI
        run: npm install -g fsh-sushi@3.21.0

      - name: Cache FHIR packages
        uses: actions/cache@v6
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-${{ hashFiles('sushi-config.yaml') }}

      - name: Cache IG Publisher
        uses: actions/cache@v6
        with:
          path: input-cache/publisher.jar
          key: publisher-${{ env.PUBLISHER_SHA256 }}

      - name: Download and verify IG Publisher
        run: |
          mkdir -p input-cache
          if ! echo "$PUBLISHER_SHA256  input-cache/publisher.jar" | sha256sum -c --status 2>/dev/null; then
            curl --fail --location --retry 4 --retry-delay 10 \
              "$PUBLISHER_URL" --output input-cache/publisher.jar
          fi
          echo "$PUBLISHER_SHA256  input-cache/publisher.jar" | sha256sum -c

      - name: Run IG Publisher
        run: |
          set -o pipefail
          # Reserve memory for Jekyll and the runner instead of assigning 12 GB to Java.
          java -Xmx6g -Dfile.encoding=UTF-8 -jar input-cache/publisher.jar \
            -ig . -tx https://tx.fhir.org 2>&1 | tee input-cache/publisher.log

      - name: Check QA report
        run: |
          test -f output/qa.json
          jq '{errors: .errs, warnings: .warnings, brokenLinks: .brokenLinks}' output/qa.json
          if ! jq -e '(.errs == 0) and (.warnings == 0)' output/qa.json >/dev/null; then
            if [ -f output/qa.txt ]; then
              awk '/^== .* ==$/ {file=$0} /^(FATAL|ERROR|WARNING):/ {if (file != shown) {print file; shown=file}; print}' output/qa.txt
            fi
            exit 1
          fi

      - name: Upload IG build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fhir-ig-build-results
          path: |
            output/
            input-cache/publisher.log
          if-no-files-found: warn
          retention-days: 14
